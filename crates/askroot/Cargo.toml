[package]
name = "sandpad-askroot"
description = "The pieces behind `sandpad -p root`: the sudo/pkexec shim inside the sandbox, the host dialog, and the server between them"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["sandbox", "bubblewrap", "sudo", "pkexec", "linux"]
categories = ["command-line-utilities", "os::linux-apis"]

[lib]
name = "sandpad_askroot"
path = "src/lib.rs"

[[bin]]
name = "sandpad-askroot-shim"
path = "src/bin/shim.rs"

[[bin]]
name = "sandpad-askroot-dialog"
path = "src/bin/dialog.rs"

[dependencies]
libc.workspace = true
iced.workspace = true
