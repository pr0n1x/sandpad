[package]
name = "sandbox-tty-exec"
description = "Runs a command as the terminal's foreground process group, from inside the sandbox's pid namespace, for `sandbox -i`"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "sandbox_tty_exec"
path = "src/lib.rs"

[[bin]]
name = "sandbox-tty-exec"
path = "src/main.rs"

[dependencies]
libc.workspace = true
