[package]
name = "sandpad"
description = "Run an app inside strict bubblewrap isolation, with a per-box home and an optional writable system layer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["sandbox", "bubblewrap", "bwrap", "isolation", "linux"]
categories = ["command-line-utilities", "os::linux-apis"]

[[bin]]
name = "sandpad"
path = "src/main.rs"

[dependencies]
libc.workspace = true
sandpad-askroot = { path = "../askroot", version = "0.1.0" }
