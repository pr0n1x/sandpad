[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/pr0n1x/sandpad"
authors = ["Maxim Makarov"]

[workspace.dependencies]
libc = "0.2"
iced = "0.14"

[profile.release]
strip = true
lto = true
